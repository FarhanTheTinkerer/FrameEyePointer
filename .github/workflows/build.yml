name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix dist/FrameEyePointer
      - uses: actions/upload-artifact@v4
        with:
          name: FrameEyePointer-windows-x64
          path: dist/FrameEyePointer

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mingw-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DEYEPOINTER_BUILD_TESTS=OFF
          cmake --build build -j

  steamframe-arm64:
    # Ubuntu 24.04's aarch64 cross toolchain has glibc 2.39, the same as SteamOS on the Frame.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the ARM64 toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu ninja-build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake \
                -DEYEPOINTER_BUILD_APP=OFF -DEYEPOINTER_BUILD_TESTS=OFF
          cmake --build build
      - name: Check the binaries only need glibc 2.39 or older
        run: |
          for f in build/frame/frameeyepointerd build/frame/driver_frameeyepointer.so; do
            newest=$(aarch64-linux-gnu-objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1)
            echo "$f: $newest"
            [ "$(printf '%s\n' "$newest" GLIBC_2.39 | sort -V | tail -1)" = GLIBC_2.39 ] || exit 1
          done
      - name: Package
        # A tarball inside the artifact: artifact zips drop the executable bits.
        run: |
          cmake --install build --prefix dist/FrameEyePointer
          tar -C dist -czf FrameEyePointer-steamframe-arm64.tar.gz FrameEyePointer
      - uses: actions/upload-artifact@v4
        with:
          name: FrameEyePointer-steamframe-arm64
          path: FrameEyePointer-steamframe-arm64.tar.gz

  publish-steamframe:
    # Every push to main republishes the headset package as the "frame-latest"
    # release, which get.sh downloads without a GitHub login.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [steamframe-arm64, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FrameEyePointer-steamframe-arm64
      - name: Publish the frame-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete frame-latest --cleanup-tag --yes || true
          gh release create frame-latest FrameEyePointer-steamframe-arm64.tar.gz \
            --target "$GITHUB_SHA" --latest \
            --title "FrameEyePointer for Steam Frame (latest)" \
            --notes "Built from ${GITHUB_SHA::7}. Install on the headset, in Konsole: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/get.sh | bash\`. See docs/STEAM_FRAME.md."
